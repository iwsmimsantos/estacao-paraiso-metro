[pytest]
# Configuração do pytest para testes do Middleware de Validação

# Diretório de testes
testpaths = ../Testes-Automatizados

# Padrão de descoberta de testes
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções de saída (simples e limpa)
addopts = 
    --tb=no
    --disable-warnings
    -p no:warnings
    -qq
    --no-header
    -p no:warnings
    -q

# Markers customizados
markers =
    rnf01: Testes do RNF-01 Segurança
    rnf02: Testes do RNF-02 Escalabilidade  
    rnf03: Testes do RNF-03 Rastreabilidade
    slow: Testes que demoram mais de 1 segundo
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
