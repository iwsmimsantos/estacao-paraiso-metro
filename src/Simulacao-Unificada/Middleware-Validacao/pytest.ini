[pytest]
# Configuração do pytest para testes do Middleware de Validação

# Diretório de testes
testpaths = tests

# Padrão de descoberta de testes
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções de saída
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    -ra

# Markers customizados
markers =
    unit: Testes unitários isolados
    integration: Testes de integração entre componentes
    rnf01: Testes do RNF-01 Segurança
    rnf02: Testes do RNF-02 Escalabilidade  
    rnf03: Testes do RNF-03 Rastreabilidade
    slow: Testes que demoram mais de 1 segundo
    security: Testes de segurança
    performance: Testes de performance e carga
    traceability: Testes de rastreabilidade

# Timeouts
timeout = 300
timeout_method = thread

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Cobertura mínima esperada
[coverage:run]
source = src
omit = 
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
